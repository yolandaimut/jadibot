<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Xu Core</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    /* --- variabel tema dinamis & garis cyber grid --- */
    :root[data-theme="emerald"] {
      --accent-main: #10b981;
      --accent-hover: #059669;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --accent-border: rgba(16, 185, 129, 0.35);
      --accent-glow: rgba(16, 185, 129, 0.22);
      --grid-line: rgba(16, 185, 129, 0.038);
      --brand-ink: #f8fafc;
    }

    :root[data-theme="cyan"] {
      --accent-main: #06b6d4;
      --accent-hover: #0891b2;
      --accent-soft: rgba(6, 182, 212, 0.14);
      --accent-border: rgba(6, 182, 212, 0.35);
      --accent-glow: rgba(6, 182, 212, 0.22);
      --grid-line: rgba(6, 182, 212, 0.038);
      --brand-ink: #f8fafc;
    }

    :root[data-theme="violet"] {
      --accent-main: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-soft: rgba(139, 92, 246, 0.14);
      --accent-border: rgba(139, 92, 246, 0.35);
      --accent-glow: rgba(139, 92, 246, 0.22);
      --grid-line: rgba(139, 92, 246, 0.04);
      --brand-ink: #f8fafc;
    }

    /* --- reset animasi bawaan view transition untuk transisi tema melingkar --- */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    /* --- pengunci viewport mutlak anti-scroll vertikal & horizontal --- */
    html,
    body {
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-height: 100vh;
      max-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }

    /* --- sembunyikan scrollbar visual pada area gulir darurat layar sangat pendek --- */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* --- animasi micro-scrolling cyber mesh grid --- */
    @keyframes cyberScroll {
      0% { background-position: 0px 0px; }
      100% { background-position: 40px 40px; }
    }

    /* --- animasi skener orbital ganda & pendar inti robot siber --- */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes corePulseGlow {
      0%, 100% {
        opacity: 0.5;
        filter: drop-shadow(0 0 4px var(--accent-main));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 10px var(--accent-main));
      }
    }

    .bg-animated-cyber-grid {
      background-color: #020617;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: cyberScroll 28s linear infinite;
    }

    .font-heading-modern {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    .brand-canvas {
      display: block;
      flex: none;
      max-width: 100%;
    }

    .accent-bg { background-color: var(--accent-main); }
    .accent-bg:hover { background-color: var(--accent-hover); }
    .accent-text { color: var(--accent-main); }
    .accent-border { border-color: var(--accent-border); }
    .accent-soft-bg { background-color: var(--accent-soft); }
    .accent-shadow { box-shadow: 0 0 18px -4px var(--accent-glow); }
  </style>
</head>
<body class="h-screen max-h-screen w-full overflow-hidden flex flex-col bg-slate-950 text-white selection:bg-slate-700 selection:text-white antialiased">

  <!-- --- navbar atas tetap dengan ikon orbital robot siber + animasi teks xu core --- -->
  <header class="shrink-0 z-40 flex items-center justify-between gap-2 w-full px-4 py-2 sm:px-6 sm:py-2.5 bg-slate-950/90 backdrop-blur-xl border-b border-slate-800/80">
    <a href="/login" class="flex items-center gap-2.5 min-w-0 flex-shrink-0 select-none" aria-label="Xu Core">
      <!-- --- wadah ikon skener orbital kompak --- -->
      <div class="w-8 h-8 rounded-xl bg-slate-900 border accent-border flex items-center justify-center relative overflow-hidden flex-shrink-0 group/icon shadow-lg">
        <div class="absolute inset-0 bg-[var(--accent-soft)] opacity-25 transition-opacity duration-300 group-hover/icon:opacity-55"></div>
        <span class="absolute inset-0.5 rounded-full border border-dashed border-[var(--accent-main)] animate-[spinClockwise_4s_linear_infinite] opacity-60 pointer-events-none"></span>
        <span class="absolute inset-1.5 rounded-full border border-dotted border-slate-500/70 animate-[spinCounterClockwise_3s_linear_infinite] opacity-50 pointer-events-none"></span>
        <svg class="w-[18px] h-[18px] text-[var(--accent-main)] relative z-10 animate-[corePulseGlow_2s_ease-in-out_infinite] transition-transform duration-300 group-hover/icon:scale-110" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2.5V5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <rect x="4" y="6" width="16" height="13" rx="3" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.16" />
          <path d="M2 11.5V14.5M22 11.5V14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <rect x="7.5" y="10" width="9" height="3.2" rx="1" fill="#ffffff" />
          <path d="M9.5 16H14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>

      <!-- --- teks animasi xu core pada canvas --- -->
      <span class="sr-only">XU CORE</span>
      <canvas id="headerBrandTextCanvas" class="brand-canvas" aria-hidden="true"></canvas>
    </a>

    <button id="themeCycleBtn" onclick="cycleAccentTheme(event)" title="Ubah Tema" class="flex items-center justify-center p-2 sm:px-3 sm:py-1.5 gap-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-slate-800 font-semibold text-slate-200 transition-all active:scale-95 shrink-0">
      <span class="w-3 h-3 rounded-full accent-bg shrink-0"></span>
      <span id="currentThemeLabel" class="hidden sm:inline text-xs">Emerald</span>
    </button>

  <!-- --- toast notifikasi kompak tepat di bawah header --- -->
  <div id="topToastBanner" class="fixed top-14 sm:top-16 left-0 right-0 z-50 flex justify-center pointer-events-none px-4 transition-all duration-300 opacity-0 -translate-y-2">
    <div class="pointer-events-auto mt-1.5 px-3.5 py-2 rounded-xl bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 shadow-lg text-xs font-medium text-slate-200 flex items-center gap-2 max-w-xl">
      <span id="topToastDot" class="w-2 h-2 rounded-full accent-bg shrink-0"></span>
      <span id="topToastText" class="break-words">Notifikasi Sistem</span>

  <!-- --- container utama rata atas dengan jarak judul rapat ke header dan proporsi pas 1 layar --- -->
  <main id="googleAuthGateSection" class="flex-1 min-h-0 w-full overflow-hidden flex flex-col items-center justify-start pt-1.5 sm:pt-3 px-4 sm:px-6 bg-slate-950 bg-animated-cyber-grid text-white relative z-10">
    <!-- --- efek cahaya ambient tema gelap --- -->
    <div class="pointer-events-none absolute -top-12 left-1/2 -translate-x-1/2 w-72 h-36 rounded-full accent-soft-bg blur-3xl opacity-30"></div>
    <div class="pointer-events-none absolute -bottom-20 left-1/2 -translate-x-1/2 w-80 h-36 rounded-full accent-soft-bg blur-3xl opacity-20"></div>

    <!-- --- container statis judul dan deskripsi terkunci rapat di posisi atas --- -->
    <div class="w-full max-w-md flex flex-col items-center text-center shrink-0 mb-2.5 sm:mb-4 relative z-10">

      <p class="mt-1 text-[13px] sm:text-sm text-slate-400 leading-relaxed max-w-[390px]">

      </p>
    </div>

    <!-- --- pembungkus form posisi atas tetap + link peralihan dinamis + ruang bawah pas --- -->
    <div id="loginFormScrollContainer" class="flex-1 min-h-0 w-full max-w-md overflow-y-auto no-scrollbar relative z-10 pb-3 sm:pb-5">
      <!-- --- kartu formulir login dan daftar dengan titik jangkar atas tetap --- -->

        <!-- --- bar tab navigasi masuk dan daftar melengkung penuh --- -->
        <div class="w-full rounded-full bg-slate-950/95 border border-slate-800/80 p-1 flex items-center" role="tablist" aria-label="Mode Autentikasi">
          <button
            id="authModeLoginTab"
            type="button"
            role="tab"
            aria-selected="true"
            onclick="switchEmailAuthMode('login')"
            class="flex-1 py-2 px-3 rounded-full bg-slate-800 border border-slate-700/80 shadow-sm text-xs font-bold text-white transition-all duration-200"
          >
            Masuk
          </button>
          <button
            id="authModeRegisterTab"
            type="button"
            role="tab"
            aria-selected="false"
            onclick="switchEmailAuthMode('register')"
            class="flex-1 py-2 px-3 rounded-full border border-transparent text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all duration-200"
          >
            Daftar
          </button>
        </div>

        <!-- --- formulir input kredensial email dan kata sandi --- -->
        <form id="emailLoginForm" class="space-y-2 sm:space-y-2.5" autocomplete="on">
          <!-- --- input nama lengkap khusus mode daftar --- -->

            <label for="loginFullNameInput" class="block text-xs font-semibold text-slate-300 pl-1">
              Nama Lengkap

            <input
              id="loginFullNameInput"
              name="fullName"
              type="text"
              autocomplete="name"
              placeholder="Masukkan nama lengkap Anda"
              class="w-full px-4 py-2 sm:py-2.5 rounded-2xl bg-slate-950/85 border border-slate-800 focus:border-fuchsia-400 text-xs sm:text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none transition-colors"
            />
          </div>

          <!-- --- input alamat email --- -->
          <div class="space-y-1">
            <label for="loginEmailInput" class="block text-xs font-semibold text-slate-300 pl-1">
              Email
            </label>
            <input
              id="loginEmailInput"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="nama@domain.com"
              class="w-full px-4 py-2 sm:py-2.5 rounded-2xl bg-slate-950/85 border border-slate-800 focus:border-fuchsia-400 text-xs sm:text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none transition-colors"
            />
          </div>

          <!-- --- input kata sandi --- -->
          <div class="space-y-1">
            <label for="loginPasswordInput" class="block text-xs font-semibold text-slate-300 pl-1">
              Kata sandi
            </label>
            <input
              id="loginPasswordInput"
              name="password"
              type="password"
              required
              minlength="6"
              autocomplete="current-password"
              placeholder="Masukkan kata sandi Anda"
              class="w-full px-4 py-2 sm:py-2.5 rounded-2xl bg-slate-950/85 border border-slate-800 focus:border-fuchsia-400 text-xs sm:text-sm text-slate-100 placeholder:text-slate-500 focus:outline-none transition-colors"
            />
          </div>

          <!-- --- tombol aksi utama masuk bergradasi --- -->
          <button
            id="emailLoginSubmitBtn"
            type="submit"
            class="w-full py-2.5 sm:py-3 px-4 mt-1 rounded-full bg-gradient-to-r from-pink-500 via-fuchsia-500 to-purple-500 hover:from-pink-400 hover:via-fuchsia-400 hover:to-purple-400 text-white font-bold text-xs sm:text-sm tracking-wide shadow-lg shadow-fuchsia-950/60 transition-all duration-200 active:scale-[0.98] disabled:opacity-60 disabled:cursor-wait"
          >
            Masuk
          </button>
        </form>

        <!-- --- pembatas menuju autentikasi google --- -->
        <div class="flex items-center gap-3">
          <span class="h-px flex-1 bg-slate-800"></span>
          <span id="loginDockCaption" class="text-[11px] font-medium text-slate-400 shrink-0">
            atau
          </span>
          <span class="h-px flex-1 bg-slate-800"></span>
        </div>

        <!-- --- tombol lanjutkan dengan google tema gelap --- -->
        <div class="relative w-full">
          <button

            type="button"
            onclick="window.google?.accounts?.id?.prompt()"

          >
            <span class="w-5 h-5 rounded-full bg-white flex items-center justify-center shrink-0">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4" />
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853" />
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05" />
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335" />
              </svg>
            </span>
            <span>Lanjutkan dengan Google</span>
          </button>

          <!-- --- wadah injeksi resmi google sign-in untuk kompatibilitas sdk --- -->
          <div class="absolute inset-0 overflow-hidden rounded-full opacity-[0.001] pointer-events-auto flex items-center justify-center">
            <div id="googleSignInButtonContainer" class="hidden w-full items-center justify-center min-h-[40px] sm:min-h-[44px]"></div>
          </div>
        </div>
      </div>

      <!-- --- teks petunjuk interaktif yang mengikuti tinggi form masuk dan daftar --- -->
      <p id="authModeFooterHint" class="mt-2.5 px-2 text-center text-xs text-slate-400 leading-snug">
        Belum punya bot terhubung?
        <button
          id="authModeSwitchLinkBtn"
          type="button"
          onclick="switchEmailAuthMode('register')"
          class="font-semibold text-white hover:underline focus:outline-none"
        >
          Buat &amp; Hubungkan Bot
        </button>
      </p>
    </div>
  </main>

  <script>
    // --- konfigurasi tema, mode autentikasi, dan client id google oauth ---
    let configuredGoogleClientId = '404486479013-8tpsuq4920rao7clth8graba1vtoon72.apps.googleusercontent.com';
    const availableThemes = ['emerald', 'cyan', 'violet'];
    let currentThemeIndex = 0;
    let currentEmailAuthMode = 'login';
    let toastTimeoutTimer = null;

    // --- animasi teks brand xu core pada canvas ---
    function initHeaderBrandTextCanvas(canvasEl, options) {
      if (!canvasEl || !canvasEl.getContext) return;

      const ctx = canvasEl.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const scaleFactor = options.scale || 1;
      const canvasWidth = options.width;
      const canvasHeight = options.height;
      const centerY = options.centerY != null ? options.centerY : canvasHeight / 2;

      canvasEl.width = Math.round(canvasWidth * scaleFactor * dpr);
      canvasEl.height = Math.round(canvasHeight * scaleFactor * dpr);
      canvasEl.style.width = `${Math.round(canvasWidth * scaleFactor)}px`;
      canvasEl.style.height = `${Math.round(canvasHeight * scaleFactor)}px`;
      ctx.scale(dpr * scaleFactor, dpr * scaleFactor);

      let brandInkColor = '#f8fafc';
      let lastStyleCheckMs = -1e9;

      const letterSpacing = 3;
      const brandText = 'XU CORE';
      const fontSize = options.fontSize || 27;
      const fontSpec = `700 ${fontSize}px Outfit, "Segoe UI", system-ui, sans-serif`;

      const timing = {
        textStart: 220,
        textStagger: 55,
        textDuration: 680,
        animEnd: 1700
      };

      function clampUnit(value) {
        return value < 0 ? 0 : value > 1 ? 1 : value;
      }

      function easeOutQuart(progress) {
        return 1 - Math.pow(1 - progress, 4);
      }

      function measureBrandTextWidth(textValue) {
        let totalWidth = 0;
        for (let idx = 0; idx < textValue.length; idx += 1) {
          totalWidth += ctx.measureText(textValue[idx]).width + letterSpacing;
        }
        return totalWidth - letterSpacing;
      }

      function renderFrame(elapsedMs) {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        const nowMs = performance.now();
        if (nowMs - lastStyleCheckMs > 300) {
          lastStyleCheckMs = nowMs;
          const computedStyles = getComputedStyle(document.documentElement);
          brandInkColor = (computedStyles.getPropertyValue('--brand-ink') || '').trim() || '#f8fafc';

          if (document.fonts && document.fonts.check && !document.fonts.check(fontSpec) && document.fonts.load) {
            document.fonts.load(fontSpec);
          }
        }

        ctx.font = fontSpec;
        const textWidth = measureBrandTextWidth(brandText);
        const textStartX = 2;
        const textBaselineY = centerY + fontSize * 0.35;

        ctx.save();
        ctx.beginPath();
        ctx.rect(textStartX - 4, textBaselineY - fontSize * 0.98, textWidth + 12, fontSize * 1.4);
        ctx.clip();

        ctx.fillStyle = brandInkColor;
        ctx.textBaseline = 'alphabetic';

        let cursorX = textStartX;
        for (let charIdx = 0; charIdx < brandText.length; charIdx += 1) {
          const charProgress = easeOutQuart(clampUnit((elapsedMs - timing.textStart - charIdx * timing.textStagger) / timing.textDuration));
          const charAdvance = ctx.measureText(brandText[charIdx]).width + letterSpacing;

          if (charProgress > 0) {
            ctx.globalAlpha = Math.min(1, charProgress * 1.6);
            ctx.fillText(brandText[charIdx], cursorX, textBaselineY + (1 - charProgress) * fontSize * 0.75);
          }
          cursorX += charAdvance;
        }

        ctx.restore();
        ctx.globalAlpha = 1;
      }

      const startTimeMs = performance.now();
      const holdDurationMs = 2800;
      const fadeDurationMs = 450;
      const totalCycleMs = timing.animEnd + holdDurationMs + fadeDurationMs;

      function animateLoop() {
        const cycleElapsed = (performance.now() - startTimeMs) % totalCycleMs;
        const fadeElapsed = cycleElapsed - (timing.animEnd + holdDurationMs);
        renderFrame(Math.min(cycleElapsed, timing.animEnd));
        canvasEl.style.opacity = fadeElapsed > 0 ? String(Math.max(0, 1 - fadeElapsed / fadeDurationMs)) : '1';
        requestAnimationFrame(animateLoop);
      }

      animateLoop();
    }

    // --- fungsi tampilkan toast notifikasi di bawah header ---
    function showTopToast(messageText, isError = false) {
      const bannerElement = document.getElementById('topToastBanner');
      const dotElement = document.getElementById('topToastDot');
      const textElement = document.getElementById('topToastText');

      if (!bannerElement || !dotElement || !textElement) return;

      textElement.textContent = messageText;
      dotElement.className = isError
        ? 'w-2 h-2 rounded-full bg-rose-500 shrink-0'
        : 'w-2 h-2 rounded-full accent-bg shrink-0';

      bannerElement.classList.remove('opacity-0', '-translate-y-2');
      bannerElement.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeoutTimer) clearTimeout(toastTimeoutTimer);
      toastTimeoutTimer = setTimeout(() => {
        bannerElement.classList.remove('opacity-100', 'translate-y-0');
        bannerElement.classList.add('opacity-0', '-translate-y-2');
      }, 3200);
    }

    // --- fungsi ganti tema aksen dengan transisi melingkar view transition ---
    function cycleAccentTheme(clickEvent) {
      currentThemeIndex = (currentThemeIndex + 1) % availableThemes.length;
      const selectedTheme = availableThemes[currentThemeIndex];
      const formattedLabel = selectedTheme.charAt(0).toUpperCase() + selectedTheme.slice(1);

      const applyThemeChanges = () => {
        document.documentElement.setAttribute('data-theme', selectedTheme);
        const labelEl = document.getElementById('currentThemeLabel');
        if (labelEl) labelEl.textContent = formattedLabel;
        localStorage.setItem('jadibot_theme_pref', selectedTheme);
      };

      if (!document.startViewTransition) {
        applyThemeChanges();
        showTopToast(`Tema aksen diubah ke ${formattedLabel}`);
        return;
      }

      const originX = clickEvent && typeof clickEvent.clientX === 'number' ? clickEvent.clientX : window.innerWidth - 28;
      const originY = clickEvent && typeof clickEvent.clientY === 'number' ? clickEvent.clientY : 28;
      const maxRadius = Math.hypot(
        Math.max(originX, window.innerWidth - originX),
        Math.max(originY, window.innerHeight - originY)
      );

      const transition = document.startViewTransition(applyThemeChanges);
      transition.ready.then(() => {
        document.documentElement.animate(
          { clipPath: [`circle(0px at ${originX}px ${originY}px)`, `circle(${maxRadius}px at ${originX}px ${originY}px)`] },
          { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', pseudoElement: '::view-transition-new(root)' }
        );
      });

      showTopToast(`Tema aksen diubah ke ${formattedLabel}`);
    }

    // --- terapkan tema tersimpan sejak awal ---
    (function initializeSavedTheme() {
      const savedTheme = localStorage.getItem('jadibot_theme_pref') || 'emerald';
      const foundIndex = availableThemes.indexOf(savedTheme);
      currentThemeIndex = foundIndex >= 0 ? foundIndex : 0;
      const themeName = availableThemes[currentThemeIndex];
      document.documentElement.setAttribute('data-theme', themeName);
      const labelEl = document.getElementById('currentThemeLabel');
      if (labelEl) {
        labelEl.textContent = themeName.charAt(0).toUpperCase() + themeName.slice(1);
      }
    })();

    // --- ubah mode formulir antara masuk dan daftar serta sinkronkan teks aksi bawah ---
    function switchEmailAuthMode(targetMode) {
      currentEmailAuthMode = targetMode === 'register' ? 'register' : 'login';
      const isRegister = currentEmailAuthMode === 'register';

      const loginTab = document.getElementById('authModeLoginTab');
      const registerTab = document.getElementById('authModeRegisterTab');
      const nameGroup = document.getElementById('registerNameFieldGroup');
      const nameInput = document.getElementById('loginFullNameInput');
      const passwordInput = document.getElementById('loginPasswordInput');
      const submitBtn = document.getElementById('emailLoginSubmitBtn');
      const footerHint = document.getElementById('authModeFooterHint');
      const formScrollContainer = document.getElementById('loginFormScrollContainer');

      const activeTabCls = 'flex-1 py-2 px-3 rounded-full bg-slate-800 border border-slate-700/80 shadow-sm text-xs font-bold text-white transition-all duration-200';
      const inactiveTabCls = 'flex-1 py-2 px-3 rounded-full border border-transparent text-xs font-semibold text-slate-400 hover:text-slate-200 transition-all duration-200';

      if (loginTab) {
        loginTab.className = isRegister ? inactiveTabCls : activeTabCls;
        loginTab.setAttribute('aria-selected', String(!isRegister));
      }
      if (registerTab) {
        registerTab.className = isRegister ? activeTabCls : inactiveTabCls;
        registerTab.setAttribute('aria-selected', String(isRegister));
      }
      if (nameGroup) nameGroup.classList.toggle('hidden', !isRegister);
      if (nameInput) nameInput.required = isRegister;
      if (passwordInput) passwordInput.autocomplete = isRegister ? 'new-password' : 'current-password';
      if (submitBtn) submitBtn.textContent = isRegister ? 'Daftar' : 'Masuk';
      if (footerHint) {
        if (isRegister) {
          footerHint.innerHTML = 'Sudah punya akun? <button id="authModeSwitchLinkBtn" type="button" onclick="switchEmailAuthMode(\'login\')" class="font-semibold text-sky-400 hover:underline focus:outline-none">Masuk di sini</button>';
        } else {
          footerHint.innerHTML = 'Belum punya bot terhubung? <button id="authModeSwitchLinkBtn" type="button" onclick="switchEmailAuthMode(\'register\')" class="font-semibold text-white hover:underline focus:outline-none">Buat &amp; Hubungkan Bot</button>';
        }
      }
      if (formScrollContainer) {
        formScrollContainer.scrollTop = 0;
      }
    }

    // --- tangani submit login atau pendaftaran dengan email dan kata sandi ---
    async function handleEmailPasswordFormSubmit(submitEvent) {
      submitEvent.preventDefault();

      const fullNameInput = document.getElementById('loginFullNameInput');
      const emailInput = document.getElementById('loginEmailInput');
      const passwordInput = document.getElementById('loginPasswordInput');
      const submitBtn = document.getElementById('emailLoginSubmitBtn');

      const isRegister = currentEmailAuthMode === 'register';
      const endpointUrl = isRegister ? '/api/auth/register' : '/api/auth/login';
      const requestPayload = {
        email: String(emailInput?.value || '').trim(),
        password: String(passwordInput?.value || '')
      };

      if (isRegister) {
        requestPayload.fullName = String(fullNameInput?.value || '').trim();
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = isRegister ? 'Mendaftarkan akun...' : 'Memverifikasi...';
      }

      try {
        const authResponse = await fetch(endpointUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(requestPayload)
        });

        const authJson = await authResponse.json().catch(() => ({}));
        if (!authResponse.ok || !authJson.isAuthenticated) {
          throw new Error(authJson.errorMessage || 'Autentikasi gagal. Periksa kembali data Anda.');
        }

        showTopToast(isRegister ? 'Akun berhasil dibuat, mengalihkan ke dashboard...' : 'Berhasil masuk, mengalihkan ke dashboard...');
        window.location.replace('/dashboard');
      } catch (requestError) {
        showTopToast(requestError.message || 'Gagal terhubung ke server.', true);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = isRegister ? 'Daftar' : 'Masuk';
        }
      }
    }

    // --- render tombol google sign-in ke dalam wadah kompatibilitas sdk ---
    function renderGoogleSignInWidget() {
      const container = document.getElementById('googleSignInButtonContainer');
      if (!container) return false;

      if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.initialize({
          client_id: configuredGoogleClientId,
          callback: handleGoogleCredentialResponse,
          auto_select: false
        });

        container.innerHTML = '';
        window.google.accounts.id.renderButton(container, {
          theme: 'filled_black',
          size: 'large',
          text: 'continue_with',
          shape: 'pill',
          width: 360
        });

        container.classList.remove('hidden');
        container.classList.add('flex');
        return true;
      }
      return false;
    }

    // --- verifikasi token google di backend dan alihkan langsung ke dashboard ---
    async function handleGoogleCredentialResponse(googleResponse) {
      if (!googleResponse || !googleResponse.credential) {
        showTopToast('Gagal menerima token dari Google', true);
        return;
      }

      const googleBtn = document.getElementById('googleCustomSignInBtn');
      if (googleBtn) googleBtn.disabled = true;
      showTopToast('Memverifikasi akun Google Anda...');

      try {
        const verifyResponse = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ credential: googleResponse.credential })
        });

        const verifyJson = await verifyResponse.json();
        if (!verifyResponse.ok || !verifyJson.isAuthenticated) {
          throw new Error(verifyJson.errorMessage || 'Verifikasi akun Google gagal');
        }

        window.location.replace('/dashboard');
      } catch (authError) {
        if (googleBtn) googleBtn.disabled = false;
        renderGoogleSignInWidget();
        showTopToast(authError.message, true);
      }
    }

    // --- inisialisasi animasi teks brand, form email, dan konfigurasi client id dari backend ---
    async function initializeLoginPortal() {
      const brandTextCanvas = document.getElementById('headerBrandTextCanvas');
      const responsiveScale = window.innerWidth < 440 ? 0.62 : 0.7;
      initHeaderBrandTextCanvas(brandTextCanvas, {
        width: 245,
        height: 46,
        centerY: 23,
        fontSize: 27,
        scale: responsiveScale
      });

      const emailForm = document.getElementById('emailLoginForm');
      if (emailForm) {
        emailForm.addEventListener('submit', handleEmailPasswordFormSubmit);
      }

      try {
        const configResponse = await fetch('/api/auth/config');
        const configData = await configResponse.json();
        if (configData.googleClientId && !configData.googleClientId.startsWith('MASUKKAN_')) {
          configuredGoogleClientId = configData.googleClientId;
        }
      } catch {
        // --- gunakan client id default jika endpoint config gagal ---
      }

      if (!renderGoogleSignInWidget()) {
        let retryAttempts = 0;
        const checkGoogleLibraryInterval = setInterval(() => {
          retryAttempts += 1;
          if (renderGoogleSignInWidget()) {
            clearInterval(checkGoogleLibraryInterval);
          } else if (retryAttempts >= 40) {
            clearInterval(checkGoogleLibraryInterval);
            showTopToast('Gagal memuat SDK Google. Nonaktifkan AdBlock jika perlu.', true);
          }
        }, 250);
      }
    }

    window.addEventListener('DOMContentLoaded', initializeLoginPortal);
  </script>

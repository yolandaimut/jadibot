<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — Xu Core</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    /* --- variabel tema dinamis & garis cyber grid --- */
    :root[data-theme="emerald"] {
      --accent-main: #10b981;
      --accent-hover: #059669;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --accent-border: rgba(16, 185, 129, 0.35);
      --accent-glow: rgba(16, 185, 129, 0.22);
      --grid-line: rgba(16, 185, 129, 0.038);
      --brand-ink: #f8fafc;
    }

    :root[data-theme="cyan"] {
      --accent-main: #06b6d4;
      --accent-hover: #0891b2;
      --accent-soft: rgba(6, 182, 212, 0.14);
      --accent-border: rgba(6, 182, 212, 0.35);
      --accent-glow: rgba(6, 182, 212, 0.22);
      --grid-line: rgba(6, 182, 212, 0.038);
      --brand-ink: #f8fafc;
    }

    :root[data-theme="violet"] {
      --accent-main: #8b5cf6;
      --accent-hover: #7c3aed;
      --accent-soft: rgba(139, 92, 246, 0.14);
      --accent-border: rgba(139, 92, 246, 0.35);
      --accent-glow: rgba(139, 92, 246, 0.22);
      --grid-line: rgba(139, 92, 246, 0.04);
      --brand-ink: #f8fafc;
    }

    /* --- reset animasi bawaan view transition untuk transisi tema melingkar --- */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    html,
    body {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: #060911;
      color: #f1f5f9;
    }

    /* --- animasi micro-scrolling cyber mesh grid --- */
    @keyframes cyberScroll {
      0% { background-position: 0px 0px; }
      100% { background-position: 40px 40px; }
    }

    /* --- animasi skener orbital ganda & pendar inti robot siber --- */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCounterClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes corePulseGlow {
      0%, 100% {
        opacity: 0.5;
        filter: drop-shadow(0 0 4px var(--accent-main));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 10px var(--accent-main));
      }
    }

    .bg-animated-cyber-grid {
      background-color: #060911;
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: cyberScroll 28s linear infinite;
    }

    .font-heading-modern {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
    }

    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }

    .brand-canvas {
      display: block;
      flex: none;
      max-width: 100%;
    }

    .accent-bg { background-color: var(--accent-main); }
    .accent-bg:hover { background-color: var(--accent-hover); }
    .accent-text { color: var(--accent-main); }
    .accent-border { border-color: var(--accent-border); }
    .accent-soft-bg { background-color: var(--accent-soft); }
    .accent-shadow { box-shadow: 0 0 18px -4px var(--accent-glow); }
  </style>
</head>
<body class="flex flex-col selection:bg-slate-700 selection:text-white antialiased">

  <!-- --- navbar atas dengan ikon orbital robot siber + animasi teks Xu Core --- -->
  <header class="shrink-0 z-40 flex items-center justify-between gap-2 w-full px-4 py-2 sm:px-6 sm:py-2.5 bg-slate-950/85 backdrop-blur-xl border-b border-slate-800/80">
    <a href="/login" class="flex items-center gap-2.5 min-w-0 flex-shrink-0 select-none" aria-label="Xu Core">

  <script>
    // --- konfigurasi tema dan client id google oauth ---
    let configuredGoogleClientId = '404486479013-8tpsuq4920rao7clth8graba1vtoon72.apps.googleusercontent.com';
    const availableThemes = ['emerald', 'cyan', 'violet'];
    let currentThemeIndex = 0;
    let toastTimeoutTimer = null;

    // --- animasi teks brand Xu Core pada canvas ---
    function initHeaderBrandTextCanvas(canvasEl, options) {
      if (!canvasEl || !canvasEl.getContext) return;

      const ctx = canvasEl.getContext('2d');
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const scaleFactor = options.scale || 1;
      const canvasWidth = options.width;
      const canvasHeight = options.height;
      const centerY = options.centerY != null ? options.centerY : canvasHeight / 2;

      canvasEl.width = Math.round(canvasWidth * scaleFactor * dpr);
      canvasEl.height = Math.round(canvasHeight * scaleFactor * dpr);
      canvasEl.style.width = `${Math.round(canvasWidth * scaleFactor)}px`;
      canvasEl.style.height = `${Math.round(canvasHeight * scaleFactor)}px`;
      ctx.scale(dpr * scaleFactor, dpr * scaleFactor);

      let brandInkColor = '#f8fafc';
      let lastStyleCheckMs = -1e9;

      const letterSpacing = 3;
      const brandText = 'XU CORE';
      const fontSize = options.fontSize || 27;
      const fontSpec = `700 ${fontSize}px Outfit, "Segoe UI", system-ui, sans-serif`;

      const timing = {
        textStart: 220,
        textStagger: 55,
        textDuration: 680,
        animEnd: 1700
      };

      function clampUnit(value) {
        return value < 0 ? 0 : value > 1 ? 1 : value;
      }

      function easeOutQuart(progress) {
        return 1 - Math.pow(1 - progress, 4);
      }

      function measureBrandTextWidth(textValue) {
        let totalWidth = 0;
        for (let idx = 0; idx < textValue.length; idx += 1) {
          totalWidth += ctx.measureText(textValue[idx]).width + letterSpacing;
        }
        return totalWidth - letterSpacing;
      }

      function renderFrame(elapsedMs) {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        const nowMs = performance.now();
        if (nowMs - lastStyleCheckMs > 300) {
          lastStyleCheckMs = nowMs;
          const computedStyles = getComputedStyle(document.documentElement);
          brandInkColor = (computedStyles.getPropertyValue('--brand-ink') || '').trim() || '#f8fafc';

          if (document.fonts && document.fonts.check && !document.fonts.check(fontSpec) && document.fonts.load) {
            document.fonts.load(fontSpec);
          }
        }

        ctx.font = fontSpec;
        const textWidth = measureBrandTextWidth(brandText);
        const textStartX = 2;
        const textBaselineY = centerY + fontSize * 0.35;

        ctx.save();
        ctx.beginPath();
        ctx.rect(textStartX - 4, textBaselineY - fontSize * 0.98, textWidth + 12, fontSize * 1.4);
        ctx.clip();

        ctx.fillStyle = brandInkColor;
        ctx.textBaseline = 'alphabetic';

        let cursorX = textStartX;
        for (let charIdx = 0; charIdx < brandText.length; charIdx += 1) {
          const charProgress = easeOutQuart(clampUnit((elapsedMs - timing.textStart - charIdx * timing.textStagger) / timing.textDuration));
          const charAdvance = ctx.measureText(brandText[charIdx]).width + letterSpacing;

          if (charProgress > 0) {
            ctx.globalAlpha = Math.min(1, charProgress * 1.6);
            ctx.fillText(brandText[charIdx], cursorX, textBaselineY + (1 - charProgress) * fontSize * 0.75);
          }
          cursorX += charAdvance;
        }

        ctx.restore();
        ctx.globalAlpha = 1;
      }

      const startTimeMs = performance.now();
      const holdDurationMs = 2800;
      const fadeDurationMs = 450;
      const totalCycleMs = timing.animEnd + holdDurationMs + fadeDurationMs;

      function animateLoop() {
        const cycleElapsed = (performance.now() - startTimeMs) % totalCycleMs;
        const fadeElapsed = cycleElapsed - (timing.animEnd + holdDurationMs);
        renderFrame(Math.min(cycleElapsed, timing.animEnd));
        canvasEl.style.opacity = fadeElapsed > 0 ? String(Math.max(0, 1 - fadeElapsed / fadeDurationMs)) : '1';
        requestAnimationFrame(animateLoop);
      }

      animateLoop();
    }

    // --- fungsi tampilkan toast notifikasi di bawah header ---
    function showTopToast(messageText, isError = false) {
      const bannerElement = document.getElementById('topToastBanner');
      const dotElement = document.getElementById('topToastDot');
      const textElement = document.getElementById('topToastText');

      if (!bannerElement || !dotElement || !textElement) return;

      textElement.textContent = messageText;
      dotElement.className = isError
        ? 'w-2 h-2 rounded-full bg-rose-500 shrink-0'
        : 'w-2 h-2 rounded-full accent-bg shrink-0';

      bannerElement.classList.remove('opacity-0', '-translate-y-2');
      bannerElement.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeoutTimer) clearTimeout(toastTimeoutTimer);
      toastTimeoutTimer = setTimeout(() => {
        bannerElement.classList.remove('opacity-100', 'translate-y-0');
        bannerElement.classList.add('opacity-0', '-translate-y-2');
      }, 3200);
    }

    // --- fungsi ganti tema aksen dengan transisi melingkar view transition ---
    function cycleAccentTheme(clickEvent) {
      currentThemeIndex = (currentThemeIndex + 1) % availableThemes.length;
      const selectedTheme = availableThemes[currentThemeIndex];
      const formattedLabel = selectedTheme.charAt(0).toUpperCase() + selectedTheme.slice(1);

      const applyThemeChanges = () => {
        document.documentElement.setAttribute('data-theme', selectedTheme);
        const labelEl = document.getElementById('currentThemeLabel');
        if (labelEl) labelEl.textContent = formattedLabel;
        localStorage.setItem('jadibot_theme_pref', selectedTheme);
      };

      if (!document.startViewTransition) {
        applyThemeChanges();
        showTopToast(`Tema aksen diubah ke ${formattedLabel}`);
        return;
      }

      const originX = clickEvent && typeof clickEvent.clientX === 'number' ? clickEvent.clientX : window.innerWidth - 28;
      const originY = clickEvent && typeof clickEvent.clientY === 'number' ? clickEvent.clientY : 28;
      const maxRadius = Math.hypot(
        Math.max(originX, window.innerWidth - originX),
        Math.max(originY, window.innerHeight - originY)
      );

      const transition = document.startViewTransition(applyThemeChanges);
      transition.ready.then(() => {
        document.documentElement.animate(
          { clipPath: [`circle(0px at ${originX}px ${originY}px)`, `circle(${maxRadius}px at ${originX}px ${originY}px)`] },
          { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', pseudoElement: '::view-transition-new(root)' }
        );
      });

      showTopToast(`Tema aksen diubah ke ${formattedLabel}`);
    }

    // --- terapkan tema tersimpan sejak awal ---
    (function initializeSavedTheme() {
      const savedTheme = localStorage.getItem('jadibot_theme_pref') || 'emerald';
      const foundIndex = availableThemes.indexOf(savedTheme);
      currentThemeIndex = foundIndex >= 0 ? foundIndex : 0;
      const themeName = availableThemes[currentThemeIndex];
      document.documentElement.setAttribute('data-theme', themeName);
      const labelEl = document.getElementById('currentThemeLabel');
      if (labelEl) {
        labelEl.textContent = themeName.charAt(0).toUpperCase() + themeName.slice(1);
      }
    })();

    // --- tampilkan kembali orbital scanner saat proses verifikasi berjalan ---
    function showOrbitalScanner(statusMessage) {
      const scannerWrapper = document.getElementById('orbitalScannerWrapper');
      const outerRing = document.getElementById('orbitalOuterRing');
      const innerRing = document.getElementById('orbitalInnerRing');
      const coreRobot = document.getElementById('orbitalCoreRobot');
      const hintLabel = document.getElementById('googleBtnLoadingHint');
      const buttonContainer = document.getElementById('googleSignInButtonContainer');

      if (buttonContainer) {
        buttonContainer.classList.add('hidden', 'opacity-0', 'scale-95');
        buttonContainer.classList.remove('flex', 'opacity-100', 'scale-100');
      }

      if (outerRing) outerRing.classList.remove('opacity-0', 'scale-90');
      if (innerRing) innerRing.classList.remove('opacity-0', 'scale-90');
      if (coreRobot) coreRobot.classList.remove('scale-125', 'opacity-0');
      if (hintLabel) {
        hintLabel.textContent = statusMessage || 'Memuat tombol Google...';
        hintLabel.classList.remove('opacity-0');
      }

      if (scannerWrapper) {
        scannerWrapper.classList.remove('hidden', 'opacity-0');
        scannerWrapper.classList.add('flex');
      }
    }

    // --- jalankan transisi keluar orbital scanner lalu tampilkan tombol google ---
    function revealGoogleButtonWithTransition(buttonContainer) {
      const scannerWrapper = document.getElementById('orbitalScannerWrapper');
      const outerRing = document.getElementById('orbitalOuterRing');
      const innerRing = document.getElementById('orbitalInnerRing');
      const coreRobot = document.getElementById('orbitalCoreRobot');
      const hintLabel = document.getElementById('googleBtnLoadingHint');

      if (!scannerWrapper || scannerWrapper.classList.contains('hidden')) {
        buttonContainer.classList.remove('hidden');
        buttonContainer.classList.add('flex');
        requestAnimationFrame(() => {
          buttonContainer.classList.remove('opacity-0', 'scale-95');
          buttonContainer.classList.add('opacity-100', 'scale-100');
        });
        return;
      }

      if (outerRing) outerRing.classList.add('opacity-0', 'scale-90');
      if (innerRing) innerRing.classList.add('opacity-0', 'scale-90');
      if (hintLabel) hintLabel.classList.add('opacity-0');
      if (coreRobot) coreRobot.classList.add('scale-125', 'opacity-0');

      setTimeout(() => {
        scannerWrapper.classList.add('hidden');
        scannerWrapper.classList.remove('flex');

        buttonContainer.classList.remove('hidden');
        buttonContainer.classList.add('flex');
        requestAnimationFrame(() => {
          buttonContainer.classList.remove('opacity-0', 'scale-95');
          buttonContainer.classList.add('opacity-100', 'scale-100');
        });
      }, 300);
    }

    // --- render tombol google sign-in ke dalam dock login ---
    function renderGoogleSignInWidget() {
      const container = document.getElementById('googleSignInButtonContainer');
      if (!container) return false;

      if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.initialize({
          client_id: configuredGoogleClientId,
          callback: handleGoogleCredentialResponse,
          auto_select: false
        });

        container.innerHTML = '';
        // --- ubah opsi teks tombol resmi google menjadi lanjut dengan google ---
        window.google.accounts.id.renderButton(container, {
          theme: 'filled_blue',
          size: 'large',
          text: 'continue_with',
          shape: 'pill',
          width: 300
        });

        revealGoogleButtonWithTransition(container);
        return true;
      }
      return false;
    }

    // --- verifikasi token google di backend dan alihkan langsung ke dashboard ---
    async function handleGoogleCredentialResponse(googleResponse) {
      if (!googleResponse || !googleResponse.credential) {
        showTopToast('Gagal menerima token dari Google', true);
        return;
      }

      const captionEl = document.getElementById('loginDockCaption');
      if (captionEl) captionEl.textContent = 'Memverifikasi akun Google Anda...';
      showOrbitalScanner('Mengalihkan ke Dashboard...');

      try {
        const verifyResponse = await fetch('/api/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ credential: googleResponse.credential })
        });

        const verifyJson = await verifyResponse.json();
        if (!verifyResponse.ok || !verifyJson.isAuthenticated) {
          throw new Error(verifyJson.errorMessage || 'Verifikasi akun Google gagal');
        }

        window.location.replace('/dashboard');
      } catch (authError) {
        if (captionEl) captionEl.textContent = 'Masuk untuk mulai mengelola bot kamu';
        renderGoogleSignInWidget();
        showTopToast(authError.message, true);
      }
    }

    // --- inisialisasi animasi teks brand dan konfigurasi client id dari backend ---
    async function initializeLoginPortal() {
      const brandTextCanvas = document.getElementById('headerBrandTextCanvas');
      const responsiveScale = window.innerWidth < 440 ? 0.62 : 0.7;
      initHeaderBrandTextCanvas(brandTextCanvas, {
        width: 245,
        height: 46,
        centerY: 23,
        fontSize: 27,
        scale: responsiveScale
      });

      try {
        const configResponse = await fetch('/api/auth/config');
        const configData = await configResponse.json();
        if (configData.googleClientId && !configData.googleClientId.startsWith('MASUKKAN_')) {
          configuredGoogleClientId = configData.googleClientId;
        }
      } catch {
        // --- gunakan client id default jika endpoint config gagal ---
      }

      if (!renderGoogleSignInWidget()) {
        let retryAttempts = 0;
        const checkGoogleLibraryInterval = setInterval(() => {
          retryAttempts += 1;
          if (renderGoogleSignInWidget()) {
            clearInterval(checkGoogleLibraryInterval);
          } else if (retryAttempts >= 40) {
            clearInterval(checkGoogleLibraryInterval);
            const hint = document.getElementById('googleBtnLoadingHint');
            if (hint) {
              hint.textContent = 'Gagal memuat SDK Google. Nonaktifkan AdBlock.';
            }
          }
        }, 250);
      }
    }

    window.addEventListener('DOMContentLoaded', initializeLoginPortal);
  </script>
</body>
